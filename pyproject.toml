[project]
name = "rag"
version = "0.1.0"
description = "CS2 tactical retrieval-augmented generation assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.4",
    "google-genai>=1.66.0",
    "openai>=2.26.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2_rag"]
